<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ติดตามปัญหา - SchoolFix</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

h2{
    text-align:center;
}

/* =========================
   SEARCH
========================= */

#search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    width:160px;
    text-align:center;
}

.box h3{
    margin:0;
    font-size:20px;
}

/* =========================
   CARD
========================= */

.card{
    background:white;
    padding:18px;
    margin-bottom:12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h3{
    margin-top:0;
    margin-bottom:12px;
}

/* =========================
   PROBLEM IMAGE
========================= */

.problem-image{
    width:100%;
    max-width:500px;
    max-height:300px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    margin-bottom:10px;
    display:block;
    cursor:pointer;
}

.image-title{
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

.no-image{
    color:#888;
    font-size:14px;
    margin-top:12px;
}

/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    margin-top:5px;
}

.pending{
    background:#ffe08a;
    color:#7a5a00;
}

.doing{
    background:#8fd3ff;
    color:#075985;
}

.done{
    background:#9cffb1;
    color:#166534;
}

/* =========================
   BUTTON
========================= */

button{
    margin-top:10px;
    margin-right:5px;
    padding:7px 12px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
}

button:hover{
    background:#1d4ed8;
}

/* =========================
   REQUEST ID
========================= */

.request-id{
    font-weight:bold;
    color:#2563eb;
    margin-bottom:10px;
}

/* =========================
   NO RESULT
========================= */

.no-result{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
    color:#777;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    body{
        padding:12px;
    }

    .box{
        width:140px;
    }

    button{
        width:100%;
        margin-right:0;
    }

    .problem-image{
        max-width:100%;
        max-height:250px;
    }

}

</style>

</head>


<body>


<h2>
    📊 ติดตามปัญหา SchoolFix
</h2>


<!-- =========================
     SEARCH
========================= -->

<input
    id="search"
    placeholder="🔍 ค้นหารหัสคำร้อง ชื่อผู้แจ้ง ประเภท สถานที่ หรือรายละเอียด..."
>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard">

    <div class="box">

        ทั้งหมด

        <br>

        <h3 id="total">
            0
        </h3>

    </div>


    <div class="box">

        รอดำเนินการ

        <br>

        <h3 id="pending">
            0
        </h3>

    </div>


    <div class="box">

        กำลังทำ

        <br>

        <h3 id="doing">
            0
        </h3>

    </div>


    <div class="box">

        เสร็จแล้ว

        <br>

        <h3 id="done">
            0
        </h3>

    </div>

</div>


<!-- =========================
     LIST
========================= -->

<div id="list"></div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBQfwnE7KqIsjbA1lAaVcL4h-VOv-N8bEw",

    authDomain:
        "schoolfix-9aa9e.firebaseapp.com",

    projectId:
        "schoolfix-9aa9e",

    storageBucket:
        "schoolfix-9aa9e.appspot.com",

    messagingSenderId:
        "516546371088",

    appId:
        "1:516546371088:web:03c7b50b574ca2a6b2f495"

};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* =========================
   ELEMENTS
========================= */

const list =
    document.getElementById("list");

const search =
    document.getElementById("search");


/* =========================
   DATA
========================= */

let problems = [];


/* =========================
   CHECK ADMIN
========================= */

onAuthStateChanged(

    auth,

    async function(user){

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            const userDoc =
                await getDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    )

                );


            if(!userDoc.exists()){

                await signOut(auth);

                window.location.href =
                    "login.html";

                return;

            }


            const userData =
                userDoc.data();


            if(userData.role !== "admin"){

                await signOut(auth);

                window.location.href =
                    "login.html";

                return;

            }


            loadProblems();

        }

        catch(error){

            console.error(
                "ตรวจสอบสิทธิ์ไม่สำเร็จ:",
                error
            );

            window.location.href =
                "login.html";

        }

    }

);


/* =========================
   TEXT
========================= */

function text(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .toLowerCase();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================
   UPDATE STATUS
========================= */

window.setStatus =
async function(id,status){

    try{

        await updateDoc(

            doc(
                db,
                "problems",
                id
            ),

            {
                status:status
            }

        );

    }

    catch(error){

        console.error(error);

        alert(
            "ไม่สามารถอัปเดตสถานะได้"
        );

    }

};


/* =========================
   LOAD PROBLEMS
========================= */

function loadProblems(){

    onSnapshot(

        collection(
            db,
            "problems"
        ),

        (snapshot)=>{

            problems = [];

            let total = 0;
            let pending = 0;
            let doing = 0;
            let done = 0;


            snapshot.forEach(

                (docSnap)=>{

                    const d =
                        docSnap.data();


                    problems.push({

                        id:
                            docSnap.id,

                        data:
                            d

                    });


                    total++;


                    if(
                        d.status === "pending"
                    ){

                        pending++;

                    }


                    if(
                        d.status === "doing"
                    ){

                        doing++;

                    }


                    if(
                        d.status === "done"
                    ){

                        done++;

                    }

                }

            );


            /* =========================
               DASHBOARD
            ========================= */

            document.getElementById(
                "total"
            ).innerText =
                total;


            document.getElementById(
                "pending"
            ).innerText =
                pending;


            document.getElementById(
                "doing"
            ).innerText =
                doing;


            document.getElementById(
                "done"
            ).innerText =
                done;


            renderProblems();

        },


        (error)=>{

            console.error(error);


            list.innerHTML = `

                <div class="no-result">

                    ❌ ไม่สามารถโหลดข้อมูลได้

                </div>

            `;

        }

    );

}


/* =========================
   RENDER
========================= */

function renderProblems(){

    list.innerHTML = "";


    const keyword =
        text(search.value).trim();


    let found = 0;


    problems.forEach(

        (item)=>{

            const d =
                item.data;


            /* =========================
               REQUEST ID
            ========================= */

            const requestId =
                d.requestId ||
                d.problemId ||
                d.code ||
                d.ticketId ||
                "";


            /* =========================
               REPORTER
            ========================= */

            const reporter =
                d.reporter ||
                d.name ||
                d.reporterName ||
                d.studentName ||
                "-";


            /* =========================
               TITLE
            ========================= */

            const title =
                d.title ||
                "ไม่ระบุหัวข้อ";


            /* =========================
               TYPE
            ========================= */

            let category =
                d.category ||
                d.type ||
                d.problemType ||
                "";


            if(
                !category &&
                title.includes(" - ")
            ){

                category =
                    title.split(" - ")[0];

            }


            /* =========================
               LOCATION
            ========================= */

            let location =
                d.location ||
                d.place ||
                d.address ||
                "";


            if(
                !location &&
                title.includes(" - ")
            ){

                location =
                    title
                    .split(" - ")
                    .slice(1)
                    .join(" - ");

            }


            /* =========================
               DETAIL
            ========================= */

            const detail =
                d.detail ||
                "";


            /* =========================
               IMAGE
            ========================= */

            const imageURL =
                d.imageURL ||
                d.imageUrl ||
                d.image ||
                "";


            /* =========================
               SEARCH
            ========================= */

            const searchableText = [

                requestId,
                reporter,
                title,
                category,
                location,
                detail

            ]

            .map(text)
            .join(" ");


            if(
                keyword !== "" &&
                !searchableText.includes(keyword)
            ){

                return;

            }


            found++;


            /* =========================
               STATUS
            ========================= */

            let statusText = "";
            let statusClass = "";


            if(d.status === "pending"){

                statusText =
                    "🔴 รอดำเนินการ";

                statusClass =
                    "pending";

            }

            else if(d.status === "doing"){

                statusText =
                    "🟡 กำลังดำเนินการ";

                statusClass =
                    "doing";

            }

            else if(d.status === "done"){

                statusText =
                    "🟢 เสร็จแล้ว";

                statusClass =
                    "done";

            }

            else{

                statusText =
                    "⚪ ไม่ระบุสถานะ";

            }


            /* =========================
               IMAGE HTML
            ========================= */

            let imageHTML = "";


            if(imageURL){

                imageHTML = `

                    <div>

                        <div class="image-title">

                            🖼️ รูปภาพปัญหา

                        </div>

                        <img
                            src="${escapeHTML(imageURL)}"
                            class="problem-image"
                            alt="รูปภาพปัญหา"
                            onclick="window.open('${escapeHTML(imageURL)}','_blank')"
                        >

                    </div>

                `;

            }

            else{

                imageHTML = `

                    <div class="no-image">

                        📷 ไม่มีรูปภาพแนบ

                    </div>

                `;

            }


            /* =========================
               CARD
            ========================= */

            list.innerHTML += `

                <div class="card">


                    ${
                        requestId
                        ?

                        `

                        <div class="request-id">

                            🎫 รหัสคำร้อง:
                            ${escapeHTML(requestId)}

                        </div>

                        `

                        :

                        ""
                    }


                    <h3>

                        ${escapeHTML(title)}

                    </h3>


                    <p>

                        👤 ผู้แจ้ง:
                        ${escapeHTML(reporter)}

                    </p>


                    ${
                        category
                        ?

                        `

                        <p>

                            🛠️ ประเภท:
                            ${escapeHTML(category)}

                        </p>

                        `

                        :

                        ""
                    }


                    ${
                        location
                        ?

                        `

                        <p>

                            📍 สถานที่:
                            ${escapeHTML(location)}

                        </p>

                        `

                        :

                        ""
                    }


                    <p>

                        📝 ${escapeHTML(detail)}

                    </p>


                    ${imageHTML}


                    <span
                        class="status ${statusClass}"
                    >

                        ${statusText}

                    </span>


                    <br>


                    ${
                        d.status !== "doing"
                        ?

                        `

                        <button
                            onclick="setStatus(
                                '${item.id}',
                                'doing'
                            )"
                        >

                            🟡 กำลังทำ

                        </button>

                        `

                        :

                        ""
                    }


                    ${
                        d.status !== "done"
                        ?

                        `

                        <button
                            onclick="setStatus(
                                '${item.id}',
                                'done'
                            )"
                        >

                            🟢 เสร็จแล้ว

                        </button>

                        `

                        :

                        ""
                    }


                </div>

            `;

        }

    );


    /* =========================
       NO RESULT
    ========================= */

    if(found === 0){

        list.innerHTML = `

            <div class="no-result">

                🔍 ไม่พบปัญหาที่ค้นหา

            </div>

        `;

    }

}


/* =========================
   SEARCH REALTIME
========================= */

search.addEventListener(
    "input",
    renderProblems
);

</script>


</body>

</html>
