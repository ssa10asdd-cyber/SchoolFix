<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ติดตามปัญหา - SchoolFix</title>


<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background:#f4f6f9;

    color:#1f2937;

    padding:20px;

}


/* =========================
   TITLE
========================= */

h2{

    text-align:center;

    color:#2563eb;

    margin-bottom:8px;

    font-size:28px;

}


.subtitle{

    text-align:center;

    color:#6b7280;

    margin-bottom:25px;

    font-size:15px;

}


/* =========================
   SEARCH
========================= */

.search-container{

    max-width:900px;

    margin:0 auto 20px;

}


#search{

    width:100%;

    padding:14px 16px;

    border-radius:10px;

    border:1px solid #d1d5db;

    font-size:15px;

    background:white;

}


#search:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.10);

}


/* =========================
   DASHBOARD
========================= */

.dashboard{

    max-width:900px;

    margin:0 auto 25px;

    display:flex;

    gap:12px;

    justify-content:center;

    flex-wrap:wrap;

}


.box{

    background:white;

    padding:18px;

    border-radius:12px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    width:160px;

    text-align:center;

}


.box-title{

    font-size:16px;

}


.box h3{

    margin-top:7px;

    font-size:25px;

    color:#2563eb;

}


/* =========================
   LIST
========================= */

#list{

    max-width:900px;

    margin:0 auto;

}


/* =========================
   CARD
========================= */

.card{

    background:white;

    padding:20px;

    margin-bottom:15px;

    border-radius:14px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}


.card h3{

    margin:12px 0;

    color:#111827;

    font-size:22px;

}


.card p{

    margin:9px 0;

    line-height:1.6;

}


/* =========================
   REQUEST ID
========================= */

.request-id{

    display:inline-block;

    background:#eff6ff;

    color:#2563eb;

    padding:7px 12px;

    border-radius:8px;

    font-weight:bold;

    margin-bottom:5px;

}


/* =========================
   STATUS
========================= */

.status{

    display:inline-block;

    padding:8px 13px;

    border-radius:8px;

    font-size:14px;

    font-weight:bold;

    margin-top:8px;

}


.pending{

    background:#fee2e2;

    color:#b91c1c;

}


.doing{

    background:#fef3c7;

    color:#92400e;

}


.done{

    background:#dcfce7;

    color:#166534;

}


.unknown{

    background:#e5e7eb;

    color:#374151;

}


/* =========================
   IMAGE
========================= */

.image-section{

    margin-top:15px;

}


.image-title{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}


.report-image{

    display:block;

    width:100%;

    max-width:450px;

    max-height:350px;

    object-fit:contain;

    border-radius:10px;

    border:1px solid #e5e7eb;

    background:#f9fafb;

    cursor:pointer;

}


.report-image:hover{

    opacity:0.92;

}


.image-error{

    display:none;

    max-width:450px;

    padding:12px;

    border-radius:10px;

    background:#fef2f2;

    color:#b91c1c;

    border:1px solid #fecaca;

    font-size:14px;

}


/* =========================
   EMPTY
========================= */

.empty{

    background:white;

    padding:30px;

    border-radius:14px;

    text-align:center;

    color:#6b7280;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.06);

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{

        padding:15px;

    }


    h2{

        font-size:24px;

    }


    .subtitle{

        font-size:14px;

    }


    .dashboard{

        gap:8px;

    }


    .box{

        width:
            calc(50% - 8px);

        padding:15px;

    }


    .box-title{

        font-size:15px;

    }


    .box h3{

        font-size:23px;

    }


    .card{

        padding:16px;

    }


    .card h3{

        font-size:20px;

    }


    .report-image{

        max-width:100%;

        max-height:300px;

    }

}

</style>

</head>


<body>


<h2>
    📋 ติดตามปัญหา SchoolFix
</h2>


<p class="subtitle">
    ตรวจสอบคำร้องและสถานะการดำเนินงาน
</p>


<!-- =========================
     SEARCH
========================= -->

<div class="search-container">

    <input
        type="text"
        id="search"
        placeholder="🔍 ค้นหารหัสคำร้อง ชื่อผู้แจ้ง ประเภท สถานที่ หรือรายละเอียด..."
    >

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard">


    <div class="box">

        <div class="box-title">
            ทั้งหมด
        </div>

        <h3 id="total">
            0
        </h3>

    </div>


    <div class="box">

        <div class="box-title">
            🔴 รอดำเนินการ
        </div>

        <h3 id="pending">
            0
        </h3>

    </div>


    <div class="box">

        <div class="box-title">
            🟡 กำลังทำ
        </div>

        <h3 id="doing">
            0
        </h3>

    </div>


    <div class="box">

        <div class="box-title">
            🟢 เสร็จแล้ว
        </div>

        <h3 id="done">
            0
        </h3>

    </div>

</div>


<!-- =========================
     LIST
========================= -->

<div id="list">

    <div class="empty">

        กำลังโหลดข้อมูล...

    </div>

</div>


<script type="module">


/* =========================================================
   FIREBASE IMPORT
========================================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBQfwnE7KqIsjbA1lAaVcL4h-VOv-N8bEw",

    authDomain:
        "schoolfix-9aa9e.firebaseapp.com",

    projectId:
        "schoolfix-9aa9e",

    storageBucket:
        "schoolfix-9aa9e.appspot.com",

    messagingSenderId:
        "516546371088",

    appId:
        "1:516546371088:web:03c7b50b574ca2a6b2f495"

};


/* =========================================================
   INITIALIZE
========================================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const list =
    document.getElementById(
        "list"
    );


const search =
    document.getElementById(
        "search"
    );


const totalElement =
    document.getElementById(
        "total"
    );


const pendingElement =
    document.getElementById(
        "pending"
    );


const doingElement =
    document.getElementById(
        "doing"
    );


const doneElement =
    document.getElementById(
        "done"
    );


/* =========================================================
   DATA
========================================================= */

let problems = [];


/* =========================================================
   TEXT HELPER
========================================================= */

function text(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .toLowerCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   GET REQUEST ID
========================================================= */

function getRequestId(data){

    return (

        data.requestId ||

        data.problemId ||

        data.code ||

        data.ticketId ||

        data.ticketNumber ||

        ""

    );

}


/* =========================================================
   GET REPORTER
========================================================= */

function getReporter(data){

    return (

        data.reporter ||

        data.name ||

        data.reporterName ||

        data.studentName ||

        "-"

    );

}


/* =========================================================
   GET CATEGORY
   รองรับข้อมูลใหม่ + ข้อมูลเก่า
========================================================= */

function getCategory(data){

    /* ข้อมูลใหม่ */

    const directCategory =

        data.category ||

        data.type ||

        data.problemType;


    if(directCategory){

        return directCategory;

    }


    /*
        ข้อมูลเก่าไม่มี category/type
        แต่ title เป็นรูปแบบ:

        อื่นๆ - อาคาร 4

        หรือ

        ไฟฟ้า - ห้อง 421
    */

    const title =
        String(
            data.title || ""
        ).trim();


    if(title){

        const separatorIndex =
            title.indexOf(" - ");


        if(separatorIndex !== -1){

            return title
                .substring(
                    0,
                    separatorIndex
                )
                .trim();

        }

    }


    return "-";

}


/* =========================================================
   GET LOCATION
   รองรับข้อมูลใหม่ + ข้อมูลเก่า
========================================================= */

function getLocation(data){

    /* ข้อมูลใหม่ */

    const directLocation =

        data.location ||

        data.place ||

        data.address;


    if(directLocation){

        return directLocation;

    }


    /*
        ข้อมูลเก่า
        ดึงส่วนหลัง " - " จาก title
    */

    const title =
        String(
            data.title || ""
        ).trim();


    if(title){

        const separatorIndex =
            title.indexOf(" - ");


        if(separatorIndex !== -1){

            const location =
                title
                    .substring(
                        separatorIndex + 3
                    )
                    .trim();


            if(location){

                return location;

            }

        }

    }


    return "-";

}


/* =========================================================
   GET IMAGE URL
========================================================= */

function getImageURL(data){

    return (

        data.imageURL ||

        data.imageUrl ||

        data.image ||

        data.photoURL ||

        data.photoUrl ||

        ""

    );

}


/* =========================================================
   GET STATUS
========================================================= */

function getStatus(status){

    if(status === "pending"){

        return {

            text:
                "🔴 รอดำเนินการ",

            className:
                "pending"

        };

    }


    if(status === "doing"){

        return {

            text:
                "🟡 กำลังดำเนินการ",

            className:
                "doing"

        };

    }


    if(status === "done"){

        return {

            text:
                "🟢 เสร็จแล้ว",

            className:
                "done"

        };

    }


    return {

        text:
            "⚪ ไม่ระบุสถานะ",

        className:
            "unknown"

    };

}


/* =========================================================
   RENDER PROBLEMS
========================================================= */

function renderProblems(){

    list.innerHTML = "";


    const keyword =
        text(
            search.value
        ).trim();


    let found = 0;


    problems.forEach(

        function(item){

            const data =
                item.data;


            /* =========================
               DATA FOR SEARCH
            ========================= */

            const documentId =
                text(
                    item.id
                );


            const requestIdValue =
                getRequestId(
                    data
                );


            const requestId =
                text(
                    requestIdValue
                );


            const title =
                text(
                    data.title
                );


            const detail =
                text(
                    data.detail
                );


            const reporter =
                text(
                    getReporter(data)
                );


            const category =
                text(
                    getCategory(data)
                );


            const location =
                text(
                    getLocation(data)
                );


            /* =========================
               SEARCH
            ========================= */

            const matched =

                keyword === ""

                ||

                documentId.includes(
                    keyword
                )

                ||

                requestId.includes(
                    keyword
                )

                ||

                title.includes(
                    keyword
                )

                ||

                detail.includes(
                    keyword
                )

                ||

                reporter.includes(
                    keyword
                )

                ||

                category.includes(
                    keyword
                )

                ||

                location.includes(
                    keyword
                );


            if(!matched){

                return;

            }


            found++;


            /* =========================
               DISPLAY
            ========================= */

            const reporterDisplay =
                getReporter(
                    data
                );


            const categoryDisplay =
                getCategory(
                    data
                );


            const locationDisplay =
                getLocation(
                    data
                );


            /*
                หัวข้อหลัก:
                ถ้ามี title ใช้ title เดิม
                ถ้าไม่มี ค่อยประกอบใหม่
            */

            const titleDisplay =

                data.title ||

                (
                    categoryDisplay !== "-"

                    ?

                    categoryDisplay +

                    (
                        locationDisplay !== "-"

                        ?

                        " - " +
                        locationDisplay

                        :

                        ""

                    )

                    :

                    "ไม่ระบุหัวข้อ"

                );


            const detailDisplay =
                data.detail ||
                "-";


            /* =========================
               STATUS
            ========================= */

            const status =
                getStatus(
                    data.status
                );


            /* =========================
               IMAGE
            ========================= */

            const imageURL =
                getImageURL(
                    data
                );


            let imageHTML =
                "";


            if(imageURL){

                const safeImageURL =
                    escapeHTML(
                        imageURL
                    );


                imageHTML = `

                    <div
                        class="image-section"
                    >

                        <span
                            class="image-title"
                        >
                            🖼️ รูปภาพปัญหา
                        </span>


                        <a
                            href="${safeImageURL}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            <img
                                class="report-image"
                                src="${safeImageURL}"
                                alt="รูปภาพปัญหา"
                                loading="lazy"
                            >

                        </a>


                        <div
                            class="image-error"
                            data-image-error="true"
                        >
                            ❌ ไม่สามารถโหลดรูปภาพได้
                        </div>

                    </div>

                `;

            }


            /* =========================
               REQUEST ID
            ========================= */

            let requestHTML =
                "";


            if(requestIdValue){

                requestHTML = `

                    <div
                        class="request-id"
                    >

                        🎫 รหัสคำร้อง:

                        ${escapeHTML(
                            requestIdValue
                        )}

                    </div>

                `;

            }


            /* =========================
               CREATE CARD
            ========================= */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                ${requestHTML}


                <h3>

                    ${escapeHTML(
                        titleDisplay
                    )}

                </h3>


                <p>

                    👤
                    <strong>
                        ผู้แจ้ง:
                    </strong>

                    ${escapeHTML(
                        reporterDisplay
                    )}

                </p>


                <p>

                    🛠️
                    <strong>
                        ประเภท:
                    </strong>

                    ${escapeHTML(
                        categoryDisplay
                    )}

                </p>


                <p>

                    📍
                    <strong>
                        สถานที่:
                    </strong>

                    ${escapeHTML(
                        locationDisplay
                    )}

                </p>


                <p>

                    📝
                    <strong>
                        รายละเอียด:
                    </strong>

                    ${escapeHTML(
                        detailDisplay
                    )}

                </p>


                ${imageHTML}


                <div>

                    <span
                        class="status ${status.className}"
                    >

                        ${status.text}

                    </span>

                </div>

            `;


            /* =========================
               IMAGE ERROR
            ========================= */

            const image =
                card.querySelector(
                    ".report-image"
                );


            if(image){

                const errorBox =
                    card.querySelector(
                        '[data-image-error="true"]'
                    );


                image.addEventListener(
                    "error",
                    function(){

                        image.style.display =
                            "none";


                        if(errorBox){

                            errorBox.style.display =
                                "block";

                        }

                    }
                );

            }


            list.appendChild(
                card
            );

        }

    );


    /* =========================
       NO RESULT
    ========================= */

    if(found === 0){

        list.innerHTML = `

            <div class="empty">

                🔍 ไม่พบคำร้องที่ค้นหา

            </div>

        `;

    }

}


/* =========================================================
   REAL-TIME FIRESTORE
========================================================= */

onSnapshot(

    collection(
        db,
        "problems"
    ),

    function(snapshot){

        problems = [];


        let total =
            0;


        let pending =
            0;


        let doing =
            0;


        let done =
            0;


        snapshot.forEach(

            function(docSnap){

                const data =
                    docSnap.data();


                problems.push({

                    id:
                        docSnap.id,

                    data:
                        data

                });


                total++;


                if(
                    data.status ===
                    "pending"
                ){

                    pending++;

                }


                if(
                    data.status ===
                    "doing"
                ){

                    doing++;

                }


                if(
                    data.status ===
                    "done"
                ){

                    done++;

                }

            }

        );


        /* =========================
           DASHBOARD
        ========================= */

        totalElement.innerText =
            total;


        pendingElement.innerText =
            pending;


        doingElement.innerText =
            doing;


        doneElement.innerText =
            done;


        /* =========================
           RENDER
        ========================= */

        renderProblems();

    },


    function(error){

        console.error(
            "Firestore Error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลคำร้องได้

                <br><br>

                กรุณาตรวจสอบการเชื่อมต่อ Firebase

            </div>

        `;

    }

);


/* =========================================================
   SEARCH REAL-TIME
========================================================= */

search.addEventListener(

    "input",

    function(){

        renderProblems();

    }

);


</script>


</body>

</html>
