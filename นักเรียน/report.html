<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งปัญหา - SchoolFix</title>


<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:30px;
    margin:0;
}

h1{
    text-align:center;
    color:#2563eb;
}

p{
    text-align:center;
}

form{
    background:white;
    max-width:550px;
    margin:auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,0.1);
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.preview-image{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}


/* =========================
   POPUP
========================= */

.popup{
    display:none;

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.popup-content{
    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    width:400px;
    max-width:90%;

    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.checkmark{
    width:120px;
    height:120px;

    margin:auto;

    border-radius:50%;

    background:#22c55e;

    color:white;

    font-size:70px;

    line-height:120px;

    font-weight:bold;
}

.popup-content h2{
    color:#22c55e;
}

.request-id{
    font-size:20px;
    font-weight:bold;

    color:#2563eb;

    margin:15px 0;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    form{
        padding:18px;
    }

    .popup-content{
        padding:30px 20px;
    }

}

</style>

</head>


<body>

<h1>🏫 SchoolFix</h1>

<p>ระบบแจ้งปัญหาภายในโรงเรียน</p>


<form id="reportForm">


    <label>
        ชื่อผู้แจ้ง
    </label>


    <input
        id="name"
        type="text"
        required
    >


    <label>
        ประเภทปัญหา
    </label>


    <select
        id="type"
        required
    >

        <option value="">
            เลือกประเภทปัญหา
        </option>

        <option value="ไฟฟ้า">
            ไฟฟ้า
        </option>

        <option value="ประปา">
            ประปา
        </option>

        <option value="อาคารสถานที่">
            อาคารสถานที่
        </option>

        <option value="อื่นๆ">
            อื่นๆ
        </option>

    </select>


    <label>
        สถานที่
    </label>


    <input
        id="place"
        type="text"
        required
    >


    <label>
        รายละเอียด
    </label>


    <textarea
        id="detail"
        rows="5"
        required
    ></textarea>


    <label>
        แนบรูปภาพ
    </label>


    <input
        id="image"
        type="file"
        accept="image/*"
    >


    <img
        id="preview"
        class="preview-image"
        alt="ตัวอย่างรูปภาพ"
    >


    <button
        id="submitButton"
        type="submit"
    >
        ส่งข้อมูล
    </button>


</form>


<!-- =========================
     SUCCESS POPUP
========================= -->

<div
    id="successBox"
    class="popup"
>

    <div class="popup-content">

        <div class="checkmark">
            ✓
        </div>

        <h2>
            ส่งข้อมูลสำเร็จ!
        </h2>

        <p>
            ข้อมูลถูกบันทึกเข้าสู่ระบบแล้ว
        </p>

        <p class="request-id">

            🎫 รหัสคำร้อง:

            <br>

            <span id="requestIdDisplay"></span>

        </p>

        <p>
            กรุณาจดรหัสคำร้องไว้สำหรับติดตามปัญหา
        </p>

        <button
            id="closePopupButton"
            type="button"
        >
            ตกลง
        </button>

    </div>

</div>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBQfwnE7KqIsjbA1lAaVcL4h-VOv-N8bEw",

    authDomain:
        "schoolfix-9aa9e.firebaseapp.com",

    projectId:
        "schoolfix-9aa9e",

    storageBucket:
        "schoolfix-9aa9e.appspot.com",

    messagingSenderId:
        "516546371088",

    appId:
        "1:516546371088:web:03c7b50b574ca2a6b2f495"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================================================
   ตรวจสอบ LOGIN
========================================================= */

let currentUser = null;

let authReadyResolve;

const authReady =
    new Promise((resolve) => {

        authReadyResolve =
            resolve;

    });


onAuthStateChanged(
    auth,
    function(user){

        currentUser =
            user;

        authReadyResolve(
            user
        );

    }
);


/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_CLOUD_NAME =
    "dtarrzqvl";


const CLOUDINARY_UPLOAD_PRESET =
    "schoolfix";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById(
        "reportForm"
    );


const imageInput =
    document.getElementById(
        "image"
    );


const preview =
    document.getElementById(
        "preview"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const requestIdDisplay =
    document.getElementById(
        "requestIdDisplay"
    );


const closePopupButton =
    document.getElementById(
        "closePopupButton"
    );


/* =========================================================
   IMAGE PREVIEW
========================================================= */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            preview.src =
                "";

            preview.style.display =
                "none";

            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "กรุณาเลือกไฟล์รูปภาพเท่านั้น"
            );

            this.value =
                "";

            preview.src =
                "";

            preview.style.display =
                "none";

            return;

        }


        const maxSize =
            10 * 1024 * 1024;


        if(file.size > maxSize){

            alert(
                "ขนาดรูปภาพต้องไม่เกิน 10 MB"
            );

            this.value =
                "";

            preview.src =
                "";

            preview.style.display =
                "none";

            return;

        }


        preview.src =
            URL.createObjectURL(file);


        preview.style.display =
            "block";

    }
);


/* =========================================================
   GENERATE REQUEST ID
========================================================= */

async function generateRequestId(){

    const year =
        new Date().getFullYear();


    const counterRef =
        doc(
            db,
            "counters",
            `problems-${year}`
        );


    const nextNumber =
        await runTransaction(

            db,

            async(transaction)=>{

                const counterDoc =
                    await transaction.get(
                        counterRef
                    );


                let number =
                    1;


                if(counterDoc.exists()){

                    number =
                        (
                            counterDoc
                                .data()
                                .lastNumber || 0
                        ) + 1;

                }


                transaction.set(

                    counterRef,

                    {
                        lastNumber:
                            number,

                        year:
                            year
                    }

                );


                return number;

            }

        );


    const paddedNumber =
        String(nextNumber)
            .padStart(4,"0");


    return `SF-${year}-${paddedNumber}`;

}


/* =========================================================
   UPLOAD TO CLOUDINARY
========================================================= */

async function uploadImageToCloudinary(
    file,
    requestId
){

    const uploadURL =
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    formData.append(
        "folder",
        `schoolfix/problems/${requestId}`
    );


    const response =
        await fetch(

            uploadURL,

            {
                method:
                    "POST",

                body:
                    formData

            }

        );


    if(!response.ok){

        const errorText =
            await response.text();


        console.error(
            "Cloudinary upload error:",
            errorText
        );


        throw new Error(
            "อัปโหลดรูปภาพไม่สำเร็จ กรุณาตรวจสอบ Cloudinary Upload Preset"
        );

    }


    const data =
        await response.json();


    if(!data.secure_url){

        throw new Error(
            "Cloudinary ไม่ส่ง URL ของรูปกลับมา"
        );

    }


    return data.secure_url;

}


/* =========================================================
   SUBMIT REPORT
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        /* รอ Firebase ตรวจสอบ Login */

        const user =
            await authReady;


        /* ต้อง Login ก่อน */

        if(!user){

            alert(
                "กรุณาเข้าสู่ระบบนักเรียนก่อนส่งข้อมูล"
            );

            return;

        }


        /* =====================================================
           FORM DATA
        ===================================================== */

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const type =
            document
                .getElementById("type")
                .value;


        const place =
            document
                .getElementById("place")
                .value
                .trim();


        const detail =
            document
                .getElementById("detail")
                .value
                .trim();


        const image =
            imageInput.files[0];


        try{


            /* =========================
               DISABLE BUTTON
            ========================= */

            submitButton.disabled =
                true;


            submitButton.textContent =
                "กำลังส่งข้อมูล...";


            /* =========================
               GENERATE REQUEST ID
            ========================= */

            const requestId =
                await generateRequestId();


            /* =========================
               IMAGE VARIABLES
            ========================= */

            let imageURL =
                "";


            let imageName =
                "";


            /* =========================
               UPLOAD IMAGE
            ========================= */

            if(image){

                submitButton.textContent =
                    "กำลังอัปโหลดรูป...";


                imageName =
                    image.name;


                imageURL =
                    await uploadImageToCloudinary(

                        image,

                        requestId

                    );

            }


            /* =========================
               SAVE TO FIRESTORE
            ========================= */

            submitButton.textContent =
                "กำลังบันทึกข้อมูล...";


            await addDoc(

                collection(
                    db,
                    "problems"
                ),

                {

                    requestId:
                        requestId,


                    reporter:
                        name,


                    /*
                        หัวข้อเดิม
                        เพื่อให้ข้อมูลเก่ายังอ่านได้
                    */

                    title:
                        type + " - " + place,


                    /*
                        บันทึกประเภทแยก
                    */

                    category:
                        type,

                    type:
                        type,

                    problemType:
                        type,


                    /*
                        บันทึกสถานที่แยก
                    */

                    location:
                        place,

                    place:
                        place,

                    address:
                        place,


                    detail:
                        detail,


                    imageName:
                        imageName,


                    imageURL:
                        imageURL,


                    status:
                        "pending",


                    time:
                        new Date(),


                    /*
                        ผู้ใช้ที่ Login
                    */

                    userId:
                        user.uid,


                    userEmail:
                        user.email || ""

                }

            );


            /* =========================
               SUCCESS
            ========================= */

            requestIdDisplay.innerText =
                requestId;


            successBox.style.display =
                "flex";


            /* =========================
               RESET
            ========================= */

            form.reset();


            preview.src =
                "";


            preview.style.display =
                "none";

        }


        catch(error){

            console.error(
                "Submit report error:",
                error
            );


            let message =
                error.message ||
                "เกิดข้อผิดพลาด";


            if(
                message.includes(
                    "Missing or insufficient permissions"
                )
            ){

                message =
                    "ไม่มีสิทธิ์บันทึกข้อมูล กรุณาตรวจสอบว่าล็อกอินนักเรียนแล้ว";

            }


            alert(
                "ส่งข้อมูลไม่สำเร็จ\n\n" +
                message
            );

        }


        finally{

            submitButton.disabled =
                false;


            submitButton.textContent =
                "ส่งข้อมูล";

        }

    }
);


/* =========================================================
   CLOSE POPUP
========================================================= */

closePopupButton.addEventListener(
    "click",
    function(){

        successBox.style.display =
            "none";

    }
);

</script>


</body>

</html>
