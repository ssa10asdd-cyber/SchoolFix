<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งปัญหา - SchoolFix</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:30px;
}

h1{
    text-align:center;
    color:#2563eb;
}

p{
    text-align:center;
}

form{
    background:white;
    max-width:550px;
    margin:auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.preview-image{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}


/* =========================
   POPUP
========================= */

.popup{
    display:none;

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    justify-content:center;
    align-items:center;
}

.popup-content{
    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    width:400px;
    max-width:90%;
}

.checkmark{
    width:120px;
    height:120px;

    margin:auto;

    border-radius:50%;

    background:#22c55e;

    color:white;

    font-size:70px;

    line-height:120px;

    font-weight:bold;
}

.popup-content h2{
    color:#22c55e;
}

.request-id{
    font-size:20px;
    font-weight:bold;

    color:#2563eb;

    margin:15px 0;
}

</style>

</head>


<body>

<h1>🏫 SchoolFix</h1>

<p>ระบบแจ้งปัญหาภายในโรงเรียน</p>


<form onsubmit="submitReport(event)">


<label>ชื่อผู้แจ้ง</label>

<input
    id="name"
    type="text"
    required
>


<label>ประเภทปัญหา</label>

<select id="type" required>

    <option value="">
        เลือกประเภทปัญหา
    </option>

    <option value="ไฟฟ้า">
        ไฟฟ้า
    </option>

    <option value="ประปา">
        ประปา
    </option>

    <option value="อาคารสถานที่">
        อาคารสถานที่
    </option>

    <option value="อื่นๆ">
        อื่นๆ
    </option>

</select>


<label>สถานที่</label>

<input
    id="place"
    type="text"
    required
>


<label>รายละเอียด</label>

<textarea
    id="detail"
    rows="5"
    required
></textarea>


<label>แนบรูปภาพ</label>

<input
    id="image"
    type="file"
    accept="image/*"
>


<img
    id="preview"
    class="preview-image"
>


<button
    id="submitButton"
    type="submit"
>
    ส่งข้อมูล
</button>

</form>



<!-- =========================
     SUCCESS POPUP
========================= -->

<div
    id="successBox"
    class="popup"
>

    <div class="popup-content">

        <div class="checkmark">
            ✓
        </div>

        <h2>
            ส่งข้อมูลสำเร็จ!
        </h2>

        <p>
            ข้อมูลถูกบันทึกเข้าสู่ระบบแล้ว
        </p>

        <p class="request-id">

            🎫 รหัสคำร้อง:

            <br>

            <span id="requestIdDisplay"></span>

        </p>

        <p>
            กรุณาจดรหัสคำร้องไว้สำหรับติดตามปัญหา
        </p>

        <button onclick="closePopup()">
            ตกลง
        </button>

    </div>

</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBQfwnE7KqIsjbA1lAaVcL4h-VOv-N8bEw",

    authDomain:
        "schoolfix-9aa9e.firebaseapp.com",

    projectId:
        "schoolfix-9aa9e",

    storageBucket:
        "schoolfix-9aa9e.appspot.com",

    messagingSenderId:
        "516546371088",

    appId:
        "1:516546371088:web:03c7b50b574ca2a6b2f495"

};



/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);



/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
    "dtarrzqvl";

const CLOUDINARY_UPLOAD_PRESET =
    "schoolfix";



/* =========================
   ELEMENTS
========================= */

const imageInput =
    document.getElementById("image");

const preview =
    document.getElementById("preview");

const submitButton =
    document.getElementById("submitButton");



/* =========================
   IMAGE PREVIEW
========================= */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(file){

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

        }

        else{

            preview.src =
                "";

            preview.style.display =
                "none";

        }

    }
);



/* =========================
   สร้างเลขรันคำร้อง
========================= */

async function generateRequestId(){

    const year =
        new Date().getFullYear();


    const counterRef =
        doc(
            db,
            "counters",
            `problems-${year}`
        );


    const nextNumber =
        await runTransaction(
            db,
            async (transaction)=>{

                const counterDoc =
                    await transaction.get(
                        counterRef
                    );


                let number = 1;


                if(counterDoc.exists()){

                    number =
                        (counterDoc.data().lastNumber || 0) + 1;

                }


                transaction.set(
                    counterRef,
                    {
                        lastNumber:number,
                        year:year
                    }
                );


                return number;

            }
        );


    const paddedNumber =
        String(nextNumber)
        .padStart(4,"0");


    return `SF-${year}-${paddedNumber}`;

}



/* =========================
   UPLOAD IMAGE TO CLOUDINARY
========================= */

async function uploadImageToCloudinary(file, requestId){

    const url =
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    /*
       ใช้รหัสคำร้องเป็นโฟลเดอร์
    */

    formData.append(
        "folder",
        `schoolfix/problems/${requestId}`
    );


    const response =
        await fetch(
            url,
            {
                method:"POST",
                body:formData
            }
        );


    if(!response.ok){

        const errorText =
            await response.text();

        console.error(
            "Cloudinary error:",
            errorText
        );

        throw new Error(
            "อัปโหลดรูปไป Cloudinary ไม่สำเร็จ"
        );

    }


    const data =
        await response.json();


    return data.secure_url;

}



/* =========================
   SUBMIT REPORT
========================= */

window.submitReport =
async function(event){

    event.preventDefault();


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const type =
        document
        .getElementById("type")
        .value;


    const place =
        document
        .getElementById("place")
        .value
        .trim();


    const detail =
        document
        .getElementById("detail")
        .value
        .trim();


    const image =
        document
        .getElementById("image")
        .files[0];


    try{

        submitButton.disabled =
            true;

        submitButton.textContent =
            "กำลังส่งข้อมูล...";


        /* =========================
           สร้างรหัสคำร้อง
        ========================= */

        const requestId =
            await generateRequestId();



        /* =========================
           ตัวแปรรูปภาพ
        ========================= */

        let imageURL = "";

        let imageName = "";



        /* =========================
           UPLOAD CLOUDINARY
        ========================= */

        if(image){

            imageName =
                image.name;


            imageURL =
                await uploadImageToCloudinary(
                    image,
                    requestId
                );

        }



        /* =========================
           บันทึก Firestore
        ========================= */

        await addDoc(

            collection(
                db,
                "problems"
            ),

            {

                requestId:
                    requestId,

                reporter:
                    name,

                title:
                    type + " - " + place,

                detail:
                    detail,

                imageName:
                    imageName,

                imageURL:
                    imageURL,

                status:
                    "pending",

                time:
                    new Date()

            }

        );



        /* =========================
           SUCCESS POPUP
        ========================= */

        document.getElementById(
            "requestIdDisplay"
        ).innerText =
            requestId;


        document.getElementById(
            "successBox"
        ).style.display =
            "flex";



        /* =========================
           RESET
        ========================= */

        document
            .querySelector("form")
            .reset();


        preview.src =
            "";

        preview.style.display =
            "none";

    }


    catch(error){

        console.error(
            "Submit report error:",
            error
        );


        alert(
            "ส่งข้อมูลไม่สำเร็จ\n\n" +
            error.message
        );

    }


    finally{

        submitButton.disabled =
            false;

        submitButton.textContent =
            "ส่งข้อมูล";

    }

};



/* =========================
   CLOSE POPUP
========================= */

window.closePopup =
function(){

    document.getElementById(
        "successBox"
    ).style.display =
        "none";

};

</script>

</body>

</html>
